name: Build and publish image and chart

# Builds the container image and packages the Helm chart, pushing both to
# GitHub Container Registry (ghcr.io) whenever a release tag is pushed. Tags
# of the form "v1.2.3" or bare semver "1.2.3" are both accepted; the leading
# "v" is stripped from the resulting image tags by the metadata step. The
# chart is pushed as an OCI artifact to oci://ghcr.io/<owner>/charts (a separate
# repository path from the image so their tag namespaces do not collide),
# tagged with the version in helm/Chart.yaml (kept in lockstep with the image tag).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to ghcr for Helm (OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          helm package helm/ --destination "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}"/chart/artifactory-airlift-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
