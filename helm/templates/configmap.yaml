apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "airlift.configMapName" . }}
  labels:
    {{- include "airlift.labels" . | nindent 4 }}
data:
  config.yaml: |
    mode: {{ .Values.mode | quote }}
    instance_name: {{ .Values.instanceName | quote }}
    artifactory_url: {{ .Values.artifactory.url | quote }}
    {{- if .Values.artifactory.caCert.existingConfigMap }}
    artifactory_ca_cert: {{ printf "%s/%s" .Values.artifactory.caCert.mountPath .Values.artifactory.caCert.key | quote }}
    {{- end }}
    {{- if .Values.artifactory.tokenFile.existingSecret }}
    artifactory_token_file: {{ printf "%s/%s" .Values.artifactory.tokenFile.mountPath .Values.artifactory.tokenFile.key | quote }}
    {{- end }}
    filestore_root: {{ .Values.paths.filestoreRoot | quote }}
    artifactory_tmp: {{ .Values.paths.artifactoryTmp | quote }}
    {{- if .Values.binarystore.configFrom.existingSecret }}
    binarystore_config: {{ printf "%s/%s" .Values.binarystore.configFrom.mountPath .Values.binarystore.configFrom.key | quote }}
    {{- else }}
    binarystore_config: {{ .Values.binarystore.configPath | quote }}
    {{- end }}
    binarystore_provider: {{ .Values.binarystore.provider | quote }}
    binarystore_multipart_threshold: {{ .Values.binarystore.multipartThreshold | quote }}
    {{- if .Values.binarystore.caCert.existingConfigMap }}
    binarystore_ca_cert: {{ printf "%s/%s" .Values.binarystore.caCert.mountPath .Values.binarystore.caCert.key | quote }}
    {{- end }}
    state_dir: {{ .Values.paths.stateMount | quote }}
    spool_dir: {{ .Values.paths.spoolMount | quote }}
    cycle_seconds: {{ .Values.cycleSeconds }}
    history_keep: {{ .Values.historyKeep }}
    done_keep_hours: {{ .Values.doneKeepHours }}
    included_repos: {{ .Values.includedRepos | toJson }}
    max_archive_bytes: {{ .Values.maxArchiveBytes | quote }}
    spool_min_free_bytes: {{ .Values.spoolMinFreeBytes | quote }}
    snapshot_retention_hours: {{ .Values.snapshotRetentionHours }}
    snapshot_retention_days: {{ .Values.snapshotRetentionDays }}
    snapshot_retention_months: {{ .Values.snapshotRetentionMonths }}
    log_level: {{ .Values.logLevel | quote }}
