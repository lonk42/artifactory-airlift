# artifactory-airlift Helm chart
#
# This chart deploys the supporting Kubernetes resources for the airlift
# sidecar: a ConfigMap, a Secret, and two PVCs (state + spool). The
# sidecar container itself is added to the artifactory pod via the
# jfrog/artifactory chart's `customSidecarContainers` field. See
# NOTES.txt for the snippet to paste into per-instance Helm values.

mode: sender  # or "receiver"
instanceName: ""

image:
  # Push the image you built from this repo's Dockerfile here and set
  # the repository + tag. Examples:
  #   repository: ghcr.io/<owner>/artifactory-airlift
  #   repository: registry.example.com/artifactory-airlift
  repository: ""
  tag: ""
  # Stated explicitly rather than left to Kubernetes' default, which depends
  # on the tag: a "latest" tag implies Always, so a registry that is briefly
  # unreachable becomes a sidecar that cannot start. A sidecar that cannot
  # start holds the whole pod out of Ready, which takes Artifactory itself
  # out of its Service. IfNotPresent reuses the copy already on the node.
  pullPolicy: IfNotPresent

# Connection to the local Artifactory (talks over loopback as a sidecar).
# Provide EITHER a bearer access token (recommended), OR a username+password
# pair for basic auth. An admin-scoped access token (applied-permissions/admin,
# or any token whose subject is an admin user) authorises every endpoint
# airlift calls, including /api/export/system and /api/import/repositories.
# Mint it once via the Artifactory UI (Administration > User Management >
# Access Tokens); it cannot be bootstrapped from username+password. Basic auth
# takes precedence when both username and password are set, so to use the
# token leave them empty. If the token is rotated in place, supply it through
# `tokenFile` below rather than `token` here.
artifactory:
  url: http://localhost:8081/artifactory
  # Plaintext only for bootstrap / dev. In production this should be
  # populated via an ExternalSecret / SealedSecret and `existingSecret`.
  token: ""
  username: ""
  password: ""
  existingSecret: ""   # if set, must contain keys: token, username, password

  # Trust a private/self-signed CA for the Artifactory TLS certificate.
  # Only needed when the url above is https with a CA that the bundled
  # certifi store does not know. Point at an existing ConfigMap that holds
  # the CA bundle (CA material is public, so a ConfigMap is the idiomatic
  # home; e.g. the namespace's kube-root-ca.crt, an injected
  # trusted-CA-bundle, or a cert-manager trust-manager Bundle). The chart
  # does not create the ConfigMap; it only references and mounts it, then
  # sets AIRLIFT_ARTIFACTORY_CA_CERT to the mounted file. Leave
  # existingConfigMap empty to skip (uses the default certifi store).
  caCert:
    existingConfigMap: ""        # ConfigMap name holding the CA bundle
    key: ca.crt                  # key/filename within it (e.g. ca-bundle.crt)
    mountPath: /etc/airlift/ca   # where it is mounted in the sidecar

  # Read the bearer token from a mounted file instead of an env var. Airlift
  # re-reads the file on every request, so a token rotated in place is picked
  # up without restarting the pod. Point at an existing Secret holding the
  # token; the chart does not create it. When existingSecret is set the chart
  # skips its own Secret and omits the token/username/password env vars from
  # the sidecar snippet, so the Secret needs only the one key.
  # Keep this a directory mount, as the generated snippet does: Kubernetes
  # never propagates updates into subPath mounts, so a subPath-mounted token
  # would be frozen at pod start.
  tokenFile:
    existingSecret: ""              # Secret name holding the token
    key: token                      # key/filename within it
    mountPath: /etc/airlift/token   # where it is mounted in the sidecar

# Binarystore access.
#
# Airlift reads and writes artifact bytes in Artifactory's binarystore
# directly. Which backend that is gets detected from Artifactory's own
# binarystore.xml on the mounted volume, so an on-disk filestore needs no
# configuration here at all and the defaults below are a no-op.
#
# Each side reads its own instance's config, so the sender and receiver may
# sit on different backends (for example Azure Blob on one and an
# S3-compatible store on the other) with no extra wiring.
#
# Object-storage backends also need credentials, and there are two ways to
# supply them. Prefer configFrom below, which reads them from binarystore.xml
# itself. Otherwise point existingSecret at a Secret holding them, needed when
# the only binarystore.xml available is Artifactory's own copy, whose
# credentials it rewrites encrypted on first boot. Expected keys:
#   accessKey / secretKey   for S3-compatible stores
#   accountKey              for Azure Blob
#
# An Azure binarystore needs no credential here at all when the platform gives
# the container an identity, which is what Artifactory itself uses where
# binarystore.xml says <useInstanceCredentials>true</useInstanceCredentials>.
# Leave accountKey unset and airlift authenticates the same way. The identity
# has to reach the airlift container, not only Artifactory's.
binarystore:
  # Path to Artifactory's binarystore descriptor inside the pod. Used unless
  # configFrom below names a Secret to read it from instead.
  configPath: /var/opt/jfrog/artifactory/etc/artifactory/binarystore.xml

  # Read binarystore.xml from a mounted Secret rather than Artifactory's own
  # on-disk copy. Prefer this where your Artifactory chart offers it: it
  # renders a copy of binarystore.xml into a Secret, and that copy still holds
  # plaintext credentials, because Artifactory only encrypts them in its own
  # file once it takes ownership on first boot. So this single mount supplies
  # the bucket, prefix, endpoint AND credentials, and nothing needs restating
  # under existingSecret below.
  #
  # Project only the binarystore.xml key, as the generated snippet does: such
  # Secrets often also carry the instance master and join keys, which the
  # sidecar has no reason to see.
  configFrom:
    existingSecret: ""                        # Secret holding binarystore.xml
    key: binarystore.xml                      # key/filename within it
    mountPath: /etc/airlift/binarystore-config

  # Backend override. "auto" trusts binarystore.xml. "filesystem" forces the
  # on-disk path if the XML cannot be parsed. "s3"/"azure" assert the detected
  # backend matches and fail loudly if not, which is worth setting once you
  # know what the backend should be: guessing wrong fails silently, writing
  # blobs where Artifactory never looks for them.
  provider: auto

  # Secret holding the object-storage credentials. The chart references it and
  # never creates it. Leave empty for a filesystem binarystore.
  existingSecret: ""
  mountPath: /etc/airlift/binarystore

  # Trust a private CA for the object-storage endpoint. Deliberately separate
  # from artifactory.caCert: the object store commonly sits behind a different
  # CA to Artifactory itself.
  caCert:
    existingConfigMap: ""
    key: ca.crt
    mountPath: /etc/airlift/binarystore-ca

  # Blobs at or above this size upload as S3 multipart / Azure staged blocks
  # instead of a single request. A single S3 PUT is capped at 5 GiB, so this
  # is what lets large artifacts through at all.
  multipartThreshold: 256Mi

# Cycle behavior.
cycleSeconds: 300
historyKeep: 24
doneKeepHours: 72

# Optional sender allowlist. Empty syncs all repos; when set, only these
# repo keys are synced (system/BuildInfo repos are still excluded on top).
includedRepos: []

# Sender chunking + spool backpressure.
#
# maxArchiveBytes splits one cycle's diff into multiple archives whose
# cumulative raw blob bytes stay under the threshold. Only the final
# chunk carries the metadata tree and removed[] list; earlier chunks
# are pure blob payloads. Filenames become "<cycle_id>-cNNN.tar.zst";
# single-chunk cycles keep the legacy "<cycle_id>.tar.zst" form. Set
# 0 to disable chunking (one monolithic archive per cycle).
#
# spoolMinFreeBytes is the high-water mark for free space on the spool
# volume. Before each chunk build the sender requires
# `disk_usage(spool).free >= spoolMinFreeBytes + projected chunk size`;
# otherwise the cycle aborts cleanly, any partial chunks for the parent
# are removed, and the cursor is left untouched so the next loop tick
# retries from the same baseline.
# Quantities accept k8s-style suffixes (Ki/Mi/Gi/Ti, K/M/G/T, plain bytes).
# Use "0" to disable chunking.
maxArchiveBytes: 8Gi
spoolMinFreeBytes: 2Gi

# GFS retention for sender-side snapshot baselines (state/snapshots/*.jsonl).
# Each tier keeps one snapshot per bucket for the configured count of
# buckets, measured from now (wall clock). The kept set is the union of
# all three tiers; a single snapshot can satisfy more than one tier.
# Months are real calendar months (not 30-day windows). At least one
# tier must be > 0.
snapshotRetentionHours: 0
snapshotRetentionDays: 3
snapshotRetentionMonths: 0

logLevel: INFO

# Security context rendered into the sidecar snippet in NOTES.txt. The
# default pins the uid/gid the jfrog/artifactory chart runs Artifactory
# as, so blobs the receiver writes match the filestore ownership. If
# your platform rejects pinned UIDs and assigns an arbitrary non-root
# UID instead, set this to null (an empty map {} would merge with the
# defaults rather than clear them). See the "Restricted security
# contexts" section in the README.
sidecar:
  securityContext:
    runAsUser: 1030
    runAsGroup: 1030

# Storage.
state:
  size: 1Gi
  storageClass: ""  # empty -> cluster default (local-path)
spool:
  size: 20Gi
  storageClass: ""

# Filesystem paths inside the artifactory pod (must match the jfrog chart).
paths:
  filestoreRoot: /var/opt/jfrog/artifactory/data/artifactory/filestore
  artifactoryTmp: /var/opt/jfrog/artifactory/data/artifactory/tmp
  stateMount: /var/airlift/state
  spoolMount: /var/airlift/spool
  configMount: /etc/airlift
